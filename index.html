<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#182b3a">
  <title>Gierka komputerowa — wielka ucieczka</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#101d28; }
    body { display:grid; place-items:center; }
    #game { display:block; width:min(100vw,177.7778vh); height:min(100vh,56.25vw); max-width:100vw; max-height:100vh; aspect-ratio:16/9; touch-action:none; image-rendering:auto; }
    @supports (height:100dvh) { #game { width:min(100vw,177.7778dvh); height:min(100dvh,56.25vw); max-height:100dvh; } }
    .nickname-control { position:fixed; z-index:2; display:flex; align-items:center; gap:10px; width:min(370px,calc(100vw - 24px)); padding:8px 12px; transform:translate(-50%,-50%); color:#fff1c9; background:#20343eeF; border:2px solid #d49b48; border-radius:7px; font:700 14px system-ui,sans-serif; }
    .nickname-control[hidden] { display:none; }
    .nickname-control input { flex:1; min-width:0; height:34px; padding:0 9px; border:1px solid #8c7952; border-radius:4px; color:#1d2b31; background:#fff7e2; font:600 16px system-ui,sans-serif; }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540" aria-label="Gra Gierka komputerowa"></canvas>
  <div id="nickname-control" class="nickname-control" hidden>
    <label for="nickname">Twój nick</label>
    <input id="nickname" name="nickname" type="text" maxlength="24" autocomplete="nickname" placeholder="Anonim">
  </div>
<script>
(() => {
  'use strict';
  const API_URL = "/api/scores"; // Same-origin API, proxied by the game server.
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const nicknameControl = document.getElementById('nickname-control');
  const nicknameInput = document.getElementById('nickname');
  const W = canvas.width, H = canvas.height, GROUND = 438;
  const rand = (a,b) => a + Math.random() * (b-a);
  const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
  const difficulties = {
    easy:{label:'SPOKOJNY BIEG',speed:.82,spawn:1.22,debt:.8},
    normal:{label:'PLAN PIĘCIOLETNI',speed:1,spawn:1,debt:1},
    hard:{label:'STAN WOJENNY',speed:1.2,spawn:.82,debt:1.35}
  };
  const missions = [
    {id:'distance',label:'Przebiegnij 800 m',goal:800},
    {id:'orange',label:'Zbierz 3 pomarańcze',goal:3},
    {id:'dodge',label:'Omiń 8 przeszkód',goal:8},
    {id:'dollar',label:'Zbierz 2 dolary',goal:2},
    {id:'sausage',label:'Zdobądź kiełbasę',goal:1}
  ];
  const game = { mode:'loading', last:0, elapsed:0, distance:0, debt:0, speed:330, spawn:1.2, obstacles:[], pickups:[], particles:[], shake:0, sound:null, muted:false, volume:.65, jumpHeld:false, assetsReady:false, assetError:'', nickname:'Anonim', scoreSubmitted:false, leaderboard:[], leaderboardMessage:'Ładowanie rekordów…', difficulty:'normal', boardSort:'distance', boardPeriod:'all', mission:null, missionProgress:0, missionDone:false, missionsCompleted:0, nextMissionDistance:0, dodged:0, message:'', messageTime:0, scenery:'osiedle', pauseFrom:'playing', bestDistance:0, achievementNotice:'', settingsOpen:false };
  const jumpKeysDown = new Set();
  const player = { x:145, y:GROUND-86, w:54, h:86, vy:0, lives:3, grounded:true, crouch:false, invuln:0, shield:0, boost:0, doubleJump:false, blink:0 };
  const clouds = Array.from({length:6},()=>({x:rand(0,W),y:rand(45,170),s:rand(.7,1.5)}));
  const sprites = Object.create(null);
  const spriteFiles = {
    gierek:'assets/gierek.png', nysa:'assets/nysa.png', fiat:'assets/fiat.png',
    stork:'assets/bocian.png', worker:'assets/robotnik.png', orange:'assets/pomarancza.png',
    dollar:'assets/dolar.png', sausage:'assets/kielbasa.png', tank:'assets/tank.png',
    queue:'assets/queue.png', pothole:'assets/pothole.png',
    background:'assets/background_osiedle.jpg',
    backgroundFactory:'assets/background_factory.jpg',
    backgroundBW:'assets/background_bw.jpg',
    backgroundLong:'assets/background_block_long.jpg',
    backgroundColor:'assets/background_color.jpg',
    backgroundLowrise:'assets/background_lowrise.jpg'
  };
  try { nicknameInput.value=localStorage.getItem('last_nickname')||'Anonim'; }
  catch { nicknameInput.value='Anonim'; }
  try {
    const prefs=JSON.parse(localStorage.getItem('gierka_settings')||'{}');
    if(['easy','normal','hard'].includes(prefs.difficulty))game.difficulty=prefs.difficulty;
    game.muted=!!prefs.muted;game.volume=clamp(Number.isFinite(prefs.volume)?prefs.volume:.65,0,1);
  } catch {}
  function saveSettings() {try{localStorage.setItem('gierka_settings',JSON.stringify({difficulty:game.difficulty,muted:game.muted,volume:game.volume}));}catch{}}
  const ridgePath = new Path2D();
  ridgePath.moveTo(-110,GROUND-92);
  for(let x=-110;x<=W+110;x+=55) ridgePath.lineTo(x,GROUND-92-Math.sin(x/96)*15);
  ridgePath.lineTo(W+110,GROUND);ridgePath.lineTo(-110,GROUND);ridgePath.closePath();

  function audio() {
    if (game.muted) return null;
    try {
      if (!game.sound) game.sound = new (window.AudioContext||window.webkitAudioContext)();
      if (game.sound.state!=='running'&&game.sound.state!=='closed'&&!game.resumePromise) {
        game.resumePromise=game.sound.resume().catch(()=>{}).finally(()=>{game.resumePromise=null;});
      }
      return game.sound;
    } catch { return null; }
  }
  function tone(freq,duration,type='square',volume=.055,endFreq=freq) {
    const ac=audio(); if(!ac) return;
    if(ac.state!=='running') {
      try {
        const resume=game.resumePromise||ac.resume();
        Promise.resolve(resume).then(()=>{if(ac.state==='running')tone(freq,duration,type,volume,endFreq);}).catch(()=>{});
      } catch { /* The browser may reject audio outside an active gesture. */ }
      return;
    }
    try {
      const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(freq,ac.currentTime); o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),ac.currentTime+duration);
      g.gain.setValueAtTime(volume,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration); o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration);
    } catch { /* Audio failures must never interrupt the game loop. */ }
  }
  function sound(kind) {
    const v=game.volume;
    if(kind==='jump') tone(230,.13,'square',.045*v,480);
    if(kind==='pickup') { tone(600,.1,'square',.04*v,900); setTimeout(()=>tone(900,.12,'square',.035*v,1200),65); }
    if(kind==='hit') { tone(150,.28,'sawtooth',.07*v,48); }
    if(kind==='over') { tone(300,.6,'triangle',.06*v,65); }
    if(kind==='mission') { tone(740,.16,'triangle',.06*v,1100); }
  }
  function cleanNickname(value) { return String(value||'').trim().slice(0,24)||'Anonim'; }
  async function loadLeaderboard() {
    try {
      const response=await fetch(`${API_URL}?sort=${game.boardSort}&period=${game.boardPeriod}`,{headers:{Accept:'application/json'}});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const data=await response.json();
      const rows=Array.isArray(data)?data:data?.scores;
      if(!Array.isArray(rows)) throw new Error('Invalid leaderboard response');
      game.leaderboard=rows.slice(0,10);
      game.leaderboardMessage=rows.length?'':(game.boardPeriod==='week'?'Brak wyników z ostatnich 7 dni.':'Brak zapisanych wyników.');
      return true;
    } catch {
      game.leaderboardMessage='Lista rekordów jest niedostępna.';
      return false;
    }
  }
  async function submitScore() {
    if(game.scoreSubmitted) return;
    game.scoreSubmitted=true;
    game.leaderboardMessage='Zapisywanie wyniku…';
    try {
      const response=await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nickname:game.nickname,debt:Math.round(game.debt),distance:Math.round(game.distance),difficulty:game.difficulty})
      });
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const refreshed=await loadLeaderboard();
      game.leaderboardMessage=refreshed?'Wynik zapisany.':'Wynik zapisany, ale lista jest niedostępna.';
    } catch {
      await loadLeaderboard();
      game.leaderboardMessage='Nie udało się zapisać wyniku.';
    }
  }
  function syncNicknameControl() {
    const visible=game.mode==='ready';
    nicknameControl.hidden=!visible;
    if(!visible) return;
    const bounds=canvas.getBoundingClientRect();
    nicknameControl.style.left=`${bounds.left+bounds.width/2}px`;
    nicknameControl.style.top=`${bounds.top+bounds.height*.56}px`;
  }
  function reset() {
    if(!game.assetsReady) return;
    game.nickname=cleanNickname(nicknameInput.value);
    nicknameInput.value=game.nickname;
    try {localStorage.setItem('last_nickname',game.nickname);} catch {}
    game.scoreSubmitted=false;
    game.mode='playing';syncNicknameControl(); game.elapsed=0; game.distance=0; game.debt=0; game.speed=330; game.spawn=.9;
    game.mission=missions[Math.floor(Math.random()*missions.length)];game.missionProgress=0;game.missionDone=false;game.missionsCompleted=0;game.nextMissionDistance=0;game.dodged=0;game.message='';game.messageTime=0;game.achievementNotice='';game.scenery='osiedle';
    game.obstacles=[]; game.pickups=[]; game.particles=[]; game.shake=0;
    Object.assign(player,{y:GROUND-86,vy:0,lives:3,grounded:true,crouch:false,invuln:0,shield:0,boost:0,doubleJump:false,blink:0});
    game.last=performance.now(); audio();
  }
  function jump() {
    if(!game.assetsReady) return;
    if(game.mode==='ready') {reset();return;}
    if(game.mode!=='playing') return;
    if(player.grounded) { player.vy=-770; player.grounded=false; sound('jump'); }
    else if(player.doubleJump) { player.vy=-690; player.doubleJump=false; sound('jump'); burst(player.x+25,player.y+player.h,'#f7d86a',8); }
  }
  function setCrouch(v) { player.crouch=v; }
  function spawnObstacle() {
    const roll=Math.random(); let type;
    if(roll<.18) type='nysa'; else if(roll<.33) type='fiat'; else if(roll<.49) type='stork'; else if(roll<.62) type='worker'; else if(roll<.73) type='queue'; else if(roll<.83) type='pothole'; else if(roll<.92) type='tank'; else type='rubin';
    const dims={nysa:[98,59],fiat:[108,54],stork:[94,43],worker:[66,100],queue:[132,95],pothole:[116,47],tank:[142,72],rubin:[58,78]}[type];
    game.obstacles.push({type,x:W+30,y: type==='stork'?GROUND-116:GROUND-dims[1],w:dims[0],h:dims[1],passed:false});
    if(Math.random()<.64) {
      const kind=['orange','dollar','sausage'][Math.floor(Math.random()*3)];
      game.pickups.push({kind,x:W+rand(190,360),y:kind==='sausage'?GROUND-62:GROUND-rand(100,185),r:kind==='sausage'?16:15,spin:0});
    }
  }
  function burst(x,y,color,count=12) { for(let i=0;i<count;i++) game.particles.push({x,y,vx:rand(-180,180),vy:rand(-220,20),life:rand(.25,.65),max:.65,color}); }
  function playerBox() {
    const crouch=player.crouch&&player.grounded, h=crouch?49:86;
    return {x:player.x+15,y:player.y+(86-h)+4,w:player.w-28,h:h-8};
  }
  function boxes(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
  function toast(message) { game.message=message;game.messageTime=2.1; }
  function addMissionProgress(id,amount=1) {
    if(!game.mission||game.mission.id!==id||game.missionDone)return;
    game.missionProgress=Math.min(game.mission.goal,game.missionProgress+amount);
    if(game.missionProgress>=game.mission.goal) {
      game.missionDone=true;game.missionsCompleted++;game.mission=null;game.missionProgress=0;
      game.debt+=100000;game.nextMissionDistance=game.distance+rand(2000,3001);
      toast('MISJA WYKONANA! Dług +$100 000');sound('mission');
    }
  }
  function unlockAchievement(id,label) {
    let unlocked=[];try{unlocked=JSON.parse(localStorage.getItem('gierka_achievements')||'[]');}catch{}
    if(unlocked.includes(id))return;
    unlocked.push(id);try{localStorage.setItem('gierka_achievements',JSON.stringify(unlocked));}catch{}
    game.achievementNotice=label;toast(`OSIĄGNIĘCIE: ${label}`);sound('mission');
  }
  function takeHit() {
    if(player.invuln>0||player.shield>0) { if(player.shield>0) {player.shield=0;burst(player.x+25,player.y+35,'#72dcff',16);} return; }
    player.lives--; player.invuln=1.35; game.shake=12; sound('hit'); burst(player.x+25,player.y+40,'#f27d61',14);
    if(player.lives<=0) {
      game.mode='over';syncNicknameControl();sound('over');
      game.bestDistance=Math.max(game.bestDistance,Math.floor(game.distance));
      if(game.distance>=1000)unlockAchievement('marathon','TOWARZYSZ MARATONU');
      if(game.dodged>=20)unlockAchievement('evasive','MISTRZ UNIKÓW');
      if(game.missionsCompleted>0)unlockAchievement('mission','PRZODOWNIK PRACY');
      void submitScore();
    }
  }
  function collect(p) {
    if(p.kind==='orange') { player.boost=5; player.doubleJump=true; game.debt=Math.max(0,game.debt-25000);addMissionProgress('orange');toast('POMARAŃCZOWY DOPING! Podwójny skok'); }
    if(p.kind==='dollar') { player.shield=6; game.debt=Math.max(0,game.debt-50000);addMissionProgress('dollar');toast('TARCZA FINANSOWA!'); }
    if(p.kind==='sausage') {player.lives=Math.min(3,player.lives+1); game.debt=Math.max(0,game.debt-10000);addMissionProgress('sausage');toast('KIEŁBASA ZWYCZAJNA!');}
    sound('pickup'); burst(p.x,p.y,p.kind==='orange'?'#ff9e3d':p.kind==='dollar'?'#78dcff':'#f5e7bd',14);
  }
  function update(dt) {
    if(game.mode!=='playing') return;
    game.elapsed+=dt;const diff=difficulties[game.difficulty]||difficulties.normal;game.distance+=game.speed*dt/12; game.speed=(Math.min(650,330+game.elapsed*5.2)+(player.boost>0?105:0))*diff.speed;
    game.debt+=dt*(3200+game.elapsed*82)*diff.debt; player.boost=Math.max(0,player.boost-dt); player.shield=Math.max(0,player.shield-dt); player.invuln=Math.max(0,player.invuln-dt); player.blink+=dt;
    if(game.mission?.id==='distance')addMissionProgress('distance',game.speed*dt/12);
    game.messageTime=Math.max(0,game.messageTime-dt);
    const sceneryIndex=Math.floor(game.distance/650)%6;game.scenery=['osiedle','fabryka','blokowisko_bw','blokowisko_long','centrum','osiedle_niskie'][sceneryIndex];
    if(!game.mission&&game.nextMissionDistance>0&&game.distance>=game.nextMissionDistance) {
      game.mission=missions[Math.floor(Math.random()*missions.length)];game.missionProgress=0;game.missionDone=false;game.nextMissionDistance=0;
      toast('NOWA MISJA!');
    }
    player.vy+=1950*dt; player.y+=player.vy*dt;
    if(player.y>=GROUND-86) {
      player.y=GROUND-86;player.vy=0;player.grounded=true;
      if(game.jumpHeld) jump();
    }
    game.spawn-=dt; if(game.spawn<=0) {spawnObstacle();game.spawn=rand(1.15,1.8)*Math.max(.64,380/game.speed)*diff.spawn;}
    for(const o of game.obstacles) o.x-=game.speed*dt*(o.type==='fiat'?1.24:1);
    for(const p of game.pickups) {p.x-=game.speed*dt;p.spin+=dt*5;}
    const pb=playerBox();
    for(let i=game.obstacles.length-1;i>=0;i--) {
      const o=game.obstacles[i];
      let ob={x:o.x+15,y:o.y+12,w:o.w-30,h:o.h-20};
      // The stork spans the jumping lane; its special rule below makes crouching
      // on the ground the only safe way through it.
      if(o.type==='stork') ob={x:o.x+5,y:o.y-4,w:o.w-10,h:o.h+45};
      if(o.type==='pothole') ob={x:o.x+4,y:o.y+6,w:o.w-8,h:o.h-6};
      if(o.type==='queue') ob={x:o.x+15,y:o.y+22,w:o.w-30,h:o.h-24};
      if(o.type==='tank') ob={x:o.x+14,y:o.y+20,w:o.w-25,h:o.h-23};
      if(o.type==='rubin') ob={x:o.x+12,y:o.y+15,w:o.w-24,h:o.h-18};
      const hitStork=o.type==='stork'
        && pb.x<ob.x+ob.w && pb.x+pb.w>ob.x
        && !(player.crouch&&player.grounded);
      if((o.type==='stork'?hitStork:boxes(pb,ob))&&!o.hit) {o.hit=true;takeHit();}
      if(!o.passed&&o.x+o.w<player.x) {o.passed=true;if(!o.hit){game.dodged++;addMissionProgress('dodge');if(game.dodged===5)unlockAchievement('first_five','PIĘĆ PRZESZKÓD Z GŁOWY');}}
      if(o.x+o.w<=-40) game.obstacles.splice(i,1);
    }
    for(let i=game.pickups.length-1;i>=0;i--) {
      const p=game.pickups[i];
      if(!p.got&&Math.hypot((player.x+27)-p.x,(player.y+38)-p.y)<42) {p.got=true;collect(p);}
      if(p.got||p.x+20<=-20) game.pickups.splice(i,1);
    }
    for(let i=game.particles.length-1;i>=0;i--) {
      const p=game.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt;p.life-=dt;
      if(p.life<=0) game.particles.splice(i,1);
    }
    game.shake=Math.max(0,game.shake-dt*32);
  }

  function rect(x,y,w,h,color) {ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
  function drawContain(image,x,y,w,h) {
    const scale=Math.min(w/image.naturalWidth,h/image.naturalHeight);
    const drawW=image.naturalWidth*scale,drawH=image.naturalHeight*scale;
    ctx.drawImage(image,x+(w-drawW)/2,y+(h-drawH)/2,drawW,drawH);
  }
  function drawSky() {
    const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#78bad0');grad.addColorStop(.72,'#c6dfc7');grad.addColorStop(1,'#f0d89f');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    // Sun and soft pixel clouds
    ctx.fillStyle='#ffe7a0';ctx.beginPath();ctx.arc(790,103,39,0,Math.PI*2);ctx.fill();
    for(const c of clouds) {const x=((c.x-game.distance*.17)%(W+180)+W+180)%(W+180)-70; const s=c.s;rect(x,c.y,75*s,19*s,'#f4f0dc');rect(x+15*s,c.y-12*s,42*s,14*s,'#f4f0dc');rect(x+66*s,c.y+5*s,26*s,13*s,'#f4f0dc');}
    // Each district uses a prepared, seamless panoramic strip from the supplied photos.
    const sceneBackgrounds={
      osiedle:sprites.background,
      fabryka:sprites.backgroundFactory,
      blokowisko_bw:sprites.backgroundBW,
      blokowisko_long:sprites.backgroundLong,
      centrum:sprites.backgroundColor,
      osiedle_niskie:sprites.backgroundLowrise
    };
    const sceneImage=sceneBackgrounds[game.scenery];
    if(sceneImage) {
      const offset=(game.distance*.32)%sceneImage.naturalWidth, y=GROUND-250;
      ctx.drawImage(sceneImage,-offset,y);
      ctx.drawImage(sceneImage,sceneImage.naturalWidth-offset,y);
    } else {
      const colors={stocznia:['#627d86','#496a73'],kopalnia:['#586c64','#3e554d'],centrum:['#9a8a72','#716657']}[game.scenery]||['#718d83','#536d65'];
      rect(0,GROUND-220,W,220,colors[0]);
      for(let i=0;i<12;i++) {
        const x=((i*112-game.distance*.23)%(W+150)+W+150)%(W+150)-100;
        const bh=90+(i*47%110), bw=72+(i*29%55);rect(x,GROUND-bh,bw,bh,colors[1]);
        for(let wy=GROUND-bh+14;wy<GROUND-18;wy+=21)for(let wx=x+10;wx<x+bw-8;wx+=19)rect(wx,wy,8,10,'#d9bd79');
      }
      if(game.scenery==='stocznia') {ctx.strokeStyle='#d0b16f';ctx.lineWidth=5;for(let i=0;i<3;i++){let x=((i*370-game.distance*.35)%(W+220)+W+220)%(W+220)-110;ctx.beginPath();ctx.moveTo(x,GROUND-70);ctx.lineTo(x,GROUND-205);ctx.lineTo(x+105,GROUND-205);ctx.lineTo(x+105,GROUND-185);ctx.moveTo(x+54,GROUND-205);ctx.lineTo(x+54,GROUND-85);ctx.stroke();}}
      if(game.scenery==='kopalnia') {for(let i=0;i<3;i++){let x=90+i*330-game.distance*.18%260;rect(x,GROUND-180,16,180,'#473e38');rect(x-8,GROUND-186,32,10,'#302f2b');ctx.fillStyle='rgba(235,230,208,.28)';ctx.beginPath();ctx.arc(x+8,GROUND-205-Math.sin(game.elapsed*2+i)*7,18,0,Math.PI*2);ctx.fill();}}
    }
    rect(0,GROUND,W,H-GROUND,'#c99c55');rect(0,GROUND,W,12,'#588147');
    for(let x=-((game.distance*1.6)%48);x<W;x+=48) {rect(x,GROUND+17,26,4,'#b78243');rect(x+22,GROUND+40,18,3,'#dfb66d');}
  }
  function drawGierek() {
    const crouch=player.crouch&&player.grounded, x=player.x, y=player.y+(crouch?34:0), scaleY=crouch?.61:1;
    if(sprites.gierek) {
      const image=sprites.gierek, drawW=player.h*image.naturalWidth/image.naturalHeight;
      ctx.drawImage(image,x+(player.w-drawW)/2,y,drawW,player.h*scaleY);
    }
    if(player.shield>0) {ctx.strokeStyle=`rgba(114,220,255,${.45+.2*Math.sin(game.elapsed*9)})`;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x+27,y+42,42,50,0,0,Math.PI*2);ctx.stroke();}
  }
  function drawObstacle(o) {
    const image=sprites[o.type];
    if(image) {if(o.type==='stork') drawContain(image,o.x-7,o.y-35,o.w+14,o.h+55);else drawContain(image,o.x,o.y,o.w,o.h);return;}
    ctx.save();
    if(o.type==='queue') {
      rect(o.x,o.y+24,o.w,o.h-24,'#85715c');rect(o.x+8,o.y+6,o.w-16,27,'#e7d6ad');
      ctx.fillStyle='#3a4545';ctx.font='bold 12px system-ui';ctx.fillText('ZA MIĘSEM',o.x+18,o.y+24);
      for(let i=0;i<5;i++){const xx=o.x+8+i*21;ctx.fillStyle=['#c38e68','#b4a07a','#697c81'][i%3];ctx.beginPath();ctx.arc(xx+8,o.y+59,9,0,Math.PI*2);ctx.fill();rect(xx+3,o.y+66,10,20,'#39474a');}
    } else if(o.type==='pothole') {ctx.fillStyle='#403c38';ctx.beginPath();ctx.ellipse(o.x+o.w/2,GROUND-4,o.w/2,14,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d7ba77';ctx.lineWidth=4;ctx.stroke();}
    else if(o.type==='tank') {rect(o.x+9,o.y+20,o.w-20,35,'#506248');rect(o.x+31,o.y+7,52,24,'#627653');rect(o.x+73,o.y+12,45,7,'#3e4c3b');ctx.fillStyle='#303d32';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(o.x+17+i*18,GROUND-3,11,0,Math.PI*2);ctx.fill();}}
    else if(o.type==='rubin') {rect(o.x+5,o.y+5,o.w-10,o.h-10,'#423a34');rect(o.x+12,o.y+13,o.w-24,o.h-30,'#544436');rect(o.x+16,o.y+17,o.w-32,o.h-40,'#d67c43');rect(o.x+o.w/2-8,o.y+o.h-7,16,7,'#282b29');}
    ctx.restore();
  }
  function drawPickup(p) {
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.spin)*.12);
    const image=sprites[p.kind];
    if(image) {
      const w=p.kind==='sausage'?42:34,h=p.kind==='sausage'?30:36;
      drawContain(image,-w/2,-h/2,w,h);
    }
    ctx.restore();
  }
  function drawHud() {
    rect(18,16,924,63,'rgba(20,39,48,.83)');
    ctx.fillStyle='#f1bf4e';ctx.font='bold 15px system-ui';ctx.fillText('DŁUG ZAGRANICZNY',34,41);
    ctx.fillStyle='#fff1c9';ctx.font='bold 25px ui-monospace,monospace';ctx.fillText('$ '+Math.floor(game.debt).toLocaleString('pl-PL'),34,66);
    ctx.fillStyle='#b8c7c1';ctx.font='bold 12px system-ui';ctx.fillText('DYSTANS  '+Math.floor(game.distance)+' m',315,43);
    ctx.fillStyle='#fff1c9';ctx.font='23px system-ui';for(let i=0;i<3;i++){ctx.globalAlpha=i<player.lives?1:.22;ctx.fillText('♥',770+i*34,54);}ctx.globalAlpha=1;
    if(player.boost>0||player.shield>0) {ctx.font='bold 11px system-ui';ctx.fillStyle=player.boost>0?'#ffb653':'#78dcff';ctx.fillText(player.boost>0?`POMARAŃCZOWY DOPING ${player.boost.toFixed(1)}s`:`TARCZA FINANSOWA ${player.shield.toFixed(1)}s`,315,65);}
    ctx.textAlign='right';ctx.fillStyle='#d4d0bd';ctx.font='bold 12px system-ui';ctx.fillText(game.muted?'DŹWIĘK: OFF [M]':'DŹWIĘK: ON [M]',920,38);ctx.fillText('PAUZA [ESC]',920,62);ctx.textAlign='left';
    if(game.mission) {rect(325,87,310,29,'rgba(20,39,48,.8)');ctx.fillStyle=game.missionDone?'#f1bf4e':'#eee8d4';ctx.font='bold 11px system-ui';const progress=game.mission.id==='distance'?Math.floor(game.missionProgress):game.missionProgress;ctx.fillText(`MISJA: ${game.mission.label}  ${progress}/${game.mission.goal}`,336,106);}
  }
  function panel(title,lines,button) {
    ctx.fillStyle='rgba(14,27,34,.74)';ctx.fillRect(0,0,W,H);
    rect(185,115,590,315,'#e1bf78');rect(193,123,574,299,'#263b43');
    ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.font='900 36px system-ui';ctx.fillText(title,W/2,174);
    ctx.fillStyle='#eee8d4';ctx.font='16px system-ui';lines.forEach((line,i)=>ctx.fillText(line,W/2,218+i*29));
    if(button) {rect(343,340,274,54,'#d95143');rect(349,346,262,42,'#efb847');ctx.fillStyle='#27363b';ctx.font='900 18px system-ui';ctx.fillText(button,W/2,374);}
    ctx.textAlign='left';
  }
  function drawGameOverPanel() {
    ctx.fillStyle='rgba(14,27,34,.78)';ctx.fillRect(0,0,W,H);
    rect(72,28,816,484,'#e1bf78');rect(80,36,800,468,'#263b43');
    ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.font='900 31px system-ui';ctx.fillText('DOSYĆ TYCH GIEREK',W/2,84);
    ctx.fillStyle='#eee8d4';ctx.font='bold 16px system-ui';
    ctx.fillText(`Dług końcowy: $ ${Math.floor(game.debt).toLocaleString('pl-PL')}   ·   Dystans: ${Math.floor(game.distance)} m`,W/2,121);
    ctx.fillStyle='#f1bf4e';ctx.font='900 18px system-ui';ctx.fillText('TOP 5 NAJLEPSZYCH WYNIKÓW',W/2,165);
    ctx.textAlign='left';ctx.font='bold 11px system-ui';ctx.fillStyle=game.boardPeriod==='all'?'#f1bf4e':'#b9c7c2';ctx.fillText('WSZECH CZASÓW',320,187);ctx.fillStyle=game.boardPeriod==='week'?'#f1bf4e':'#b9c7c2';ctx.fillText('OSTATNIE 7 DNI',460,187);
    ctx.fillStyle=game.boardSort==='distance'?'#f1bf4e':'#b9c7c2';ctx.fillText('DYSTANS',625,187);ctx.fillStyle=game.boardSort==='debt'?'#f1bf4e':'#b9c7c2';ctx.fillText('DŁUG',710,187);
    ctx.textAlign='left';ctx.fillStyle='#b9c7c2';ctx.font='bold 12px system-ui';
    ctx.fillText('MIEJSCE',120,211);ctx.fillText('NICK',225,211);ctx.fillText('TRYB',455,211);
    ctx.textAlign='right';ctx.fillText('DŁUG',685,211);ctx.fillText('DYSTANS',835,211);
    ctx.font='13px system-ui';
    const rows=game.leaderboard.slice(0,5);
    rows.forEach((score,index)=>{
      const y=238+index*27;
      ctx.textAlign='left';ctx.fillStyle=index===0?'#f2bd4b':'#eee8d4';
      ctx.fillText(String(index+1).padStart(2,'0'),130,y);
      ctx.fillText(cleanNickname(score.nickname),225,y,210);
      ctx.textAlign='left';ctx.fillStyle='#b9c7c2';ctx.font='bold 10px system-ui';
      ctx.fillText(difficulties[score.difficulty]?.label||'BRAK DANYCH',455,y,150);
      ctx.textAlign='right';
      ctx.font='13px system-ui';ctx.fillStyle=index===0?'#f2bd4b':'#eee8d4';
      ctx.fillText(`$ ${Math.floor(Number(score.debt)||0).toLocaleString('pl-PL')}`,685,y);
      ctx.fillText(`${Math.floor(Number(score.distance)||0).toLocaleString('pl-PL')} m`,835,y);
    });
    if(!rows.length) {ctx.textAlign='center';ctx.fillStyle='#eee8d4';ctx.fillText(game.leaderboardMessage||'Brak wyników.',W/2,258);}
    else if(game.leaderboardMessage) {ctx.textAlign='center';ctx.fillStyle='#b9c7c2';ctx.font='12px system-ui';ctx.fillText(game.leaderboardMessage,W/2,385);}
    let earned=[];try{earned=JSON.parse(localStorage.getItem('gierka_achievements')||'[]');}catch{}
    const missionSummary=game.mission
      ? `MISJA: ${game.mission.label} · ${game.missionDone?'WYKONANA':'niewykonana'}`
      : `MISJE WYKONANE: ${game.missionsCompleted}`;
    ctx.textAlign='center';ctx.fillStyle=game.missionsCompleted>0?'#f1bf4e':'#b9c7c2';ctx.font='11px system-ui';ctx.fillText(missionSummary,W/2,367);
    ctx.fillStyle='#b9c7c2';ctx.fillText(`OSIĄGNIĘCIA: ${earned.length?earned.length+' odblokowane':'jeszcze brak — spróbuj ponownie!'}`,W/2,400);
    if(game.achievementNotice){ctx.fillStyle='#f1bf4e';ctx.fillText(`NOWE: ${game.achievementNotice}`,W/2,414);}
    rect(190,432,280,54,'#d95143');rect(196,438,268,42,'#efb847');
    rect(490,432,280,54,'#52747a');rect(496,438,268,42,'#d3d5b5');
    ctx.textAlign='center';ctx.fillStyle='#27363b';ctx.font='900 15px system-ui';ctx.fillText('ZAGRAJ PONOWNIE',330,465);ctx.fillText('WYBIERZ POZIOM',630,465);
    ctx.textAlign='left';
  }
  function drawReadyPanel() {
    ctx.fillStyle='rgba(14,27,34,.72)';ctx.fillRect(0,0,W,H);rect(185,74,590,400,'#e1bf78');rect(193,82,574,384,'#263b43');
    ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.font='900 34px system-ui';ctx.fillText('GIERKA KOMPUTEROWA',W/2,130);
    ctx.fillStyle='#eee8d4';ctx.font='15px system-ui';ctx.fillText('Edward Gierek rusza w trasę. Fabryka już czeka!',W/2,166);ctx.fillText('Skacz nad pojazdami, kucaj pod bocianami. Zbieraj zapasy.',W/2,190);
    ctx.fillStyle='#f1bf4e';ctx.font='bold 13px system-ui';ctx.fillText('WYBIERZ TRYB',W/2,225);
    const keys=['easy','normal','hard'];keys.forEach((key,i)=>{const x=248+i*156,selected=game.difficulty===key;rect(x,239,146,38,selected?'#d69c3e':'#40565a');ctx.fillStyle=selected?'#24363a':'#eee8d4';ctx.font='bold 11px system-ui';ctx.fillText(difficulties[key].label,x+73,263);});
    ctx.fillStyle='#b9c7c2';ctx.font='12px system-ui';ctx.fillText('↑ / Spacja: skok · ↓: kucanie · Esc: pauza · M: dźwięk',W/2,352);ctx.fillText('Głośność zmienisz klawiszami + / − podczas pauzy.',W/2,373);
    rect(343,402,274,54,'#d95143');rect(349,408,262,42,'#efb847');ctx.fillStyle='#27363b';ctx.font='900 18px system-ui';ctx.fillText('ROZPOCZNIJ BIEG',W/2,436);ctx.textAlign='left';
  }
  function drawPausePanel() {
    ctx.fillStyle='rgba(14,27,34,.72)';ctx.fillRect(0,0,W,H);rect(280,146,400,248,'#e1bf78');rect(288,154,384,232,'#263b43');
    ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.font='900 32px system-ui';ctx.fillText('PAUZA',W/2,207);ctx.fillStyle='#eee8d4';ctx.font='14px system-ui';ctx.fillText('Esc — wróć do gry · M — dźwięk',W/2,242);
    rect(342,276,276,42,'#efb847');ctx.fillStyle='#27363b';ctx.font='900 16px system-ui';ctx.fillText('WRÓĆ DO BIEGU',W/2,303);ctx.fillStyle='#b9c7c2';ctx.font='12px system-ui';ctx.fillText(`Głośność: ${Math.round(game.volume*100)}%   [ − ] / [ + ]`,W/2,346);ctx.textAlign='left';
  }
  function render() {
    ctx.save();if(game.shake>0)ctx.translate(rand(-game.shake,game.shake),rand(-game.shake,game.shake));
    if(game.mode==='loading'||game.mode==='asset-error') {
      drawSky();ctx.restore();
      if(game.mode==='loading') panel('ŁADOWANIE GRAFIK',['Wczytuję obrazy gry. Za chwilę zaczynamy.'],'');
      else panel('BRAK GRAFIKI',[game.assetError,'Sprawdź pliki w folderze assets i odśwież stronę.'],'ODŚWIEŻ STRONĘ');
      return;
    }
    drawSky();for(const p of game.pickups)drawPickup(p);for(const o of game.obstacles)drawObstacle(o);
    for(const p of game.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);rect(p.x,p.y,5,5,p.color);}ctx.globalAlpha=1;
    if(!(player.invuln>0&&Math.floor(player.blink*14)%2===0))drawGierek();drawHud();ctx.restore();
    if(game.mode==='ready') drawReadyPanel();
    if(game.mode==='over') drawGameOverPanel();
    if(game.mode==='paused') drawPausePanel();
    if(game.messageTime>0&&game.mode==='playing') {ctx.fillStyle='rgba(20,39,48,.9)';ctx.fillRect(260,126,440,38);ctx.textAlign='center';ctx.fillStyle='#ffe2a0';ctx.font='bold 15px system-ui';ctx.fillText(game.message,W/2,151);ctx.textAlign='left';}
  }
  function frame(now) {const dt=Math.min(.05,(now-game.last)/1000||0);game.last=now;update(dt);render();requestAnimationFrame(frame);}
  function loadSprites() {
    return Promise.all(Object.entries(spriteFiles).map(([name,src])=>new Promise((resolve,reject)=>{
      const image=new Image();
      image.onload=()=>{sprites[name]=image;resolve(image);};
      image.onerror=()=>reject(new Error(`Brak pliku: ${src}`));
      image.src=src;
    })));
  }
  function pointerPoint(e) {const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
  function pauseGame() {if(game.mode==='playing'){game.mode='paused';setCrouch(false);game.jumpHeld=false;}else if(game.mode==='paused')game.mode='playing';}
  function returnToMenu() {
    game.mode='ready';game.elapsed=0;game.distance=0;game.debt=0;game.obstacles=[];game.pickups=[];game.particles=[];game.shake=0;game.achievementNotice='';
    Object.assign(player,{y:GROUND-86,vy:0,lives:3,grounded:true,crouch:false,invuln:0,shield:0,boost:0,doubleJump:false,blink:0});
    syncNicknameControl();
  }
  window.addEventListener('keydown',e=>{
    if(e.target===nicknameInput) return;
    if(['ArrowUp','ArrowDown',' ','Escape'].includes(e.key)) e.preventDefault();
    audio();
    if(e.key==='Escape'){if(game.mode==='over')returnToMenu();else pauseGame();return;}
    if(e.key==='+'||e.key==='='){game.volume=clamp(game.volume+.1,0,1);saveSettings();return;}
    if(e.key==='-'||e.key==='_'){game.volume=clamp(game.volume-.1,0,1);saveSettings();return;}
    if(e.key==='ArrowUp'||e.key===' ') jumpKeysDown.add(e.key);
    if(e.repeat)return;
    if(e.key==='ArrowUp'||e.key===' ') {game.jumpHeld=true;jump();}
    if(e.key==='ArrowDown')setCrouch(true);
    if(e.key.toLowerCase()==='m'){game.muted=!game.muted;saveSettings();}
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='ArrowDown')setCrouch(false);
    if(e.key==='ArrowUp'||e.key===' ') {
      jumpKeysDown.delete(e.key);
      game.jumpHeld=jumpKeysDown.size>0;
    }
  });
  window.addEventListener('blur',()=>{jumpKeysDown.clear();game.jumpHeld=false;setCrouch(false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.mode==='playing')pauseGame();});
  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();audio();canvas.setPointerCapture?.(e.pointerId);
    const {x,y}=pointerPoint(e);
    if(game.mode==='ready') {
      if(y>=239&&y<=277){const i=clamp(Math.floor((x-248)/156),0,2);game.difficulty=['easy','normal','hard'][i];saveSettings();return;}
      if(x>=343&&x<=617&&y>=402&&y<=456){reset();return;}
      return;
    }
    if(game.mode==='paused') {if(x>=330&&x<=630&&y>=270&&y<=324)pauseGame();else if(y>=328&&y<=365){game.volume=clamp(game.volume+(x<W/2?-.1:.1),0,1);saveSettings();}return;}
    if(game.mode==='over') {
      if(y>=176&&y<=202) {
        if(x>=305&&x<450)game.boardPeriod='all';else if(x>=450&&x<590)game.boardPeriod='week';else if(x>=590&&x<700)game.boardSort='distance';else if(x>=700&&x<775)game.boardSort='debt';
        void loadLeaderboard();return;
      }
      if(y>=432&&y<=486&&x>=190&&x<=470){reset();return;}
      if(y>=432&&y<=486&&x>=490&&x<=770){returnToMenu();return;}
      return;
    }
    if(game.mode!=='playing') {
      if(game.mode==='asset-error'&&x>=343&&x<=617&&y>=340&&y<=405) location.reload();
      return;
    }
    if(y<82&&x>820){game.muted=!game.muted;saveSettings();return;}
    if(y<82&&x>700){pauseGame();return;}
    if(e.pointerType==='touch') {
      if(x<W/2||y>=H*.72) setCrouch(true); else jump();
    } else jump();
  });
  canvas.addEventListener('pointerup',()=>setCrouch(false));
  canvas.addEventListener('pointercancel',()=>setCrouch(false));
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('resize',syncNicknameControl);
  loadLeaderboard();
  game.last=performance.now();requestAnimationFrame(frame);
  loadSprites().then(()=>{game.assetsReady=true;game.mode='ready';syncNicknameControl();}).catch(error=>{game.assetError=error.message;game.mode='asset-error';syncNicknameControl();});
})();
</script>
</body>
</html>
